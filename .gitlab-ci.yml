image: git3.nexdev.net:5050/lumi-ops/docker-images/docker:19.03.12
services:
  - git3.nexdev.net:5050/lumi-ops/docker-images/docker:19.03.12-dind

stages:
  - build
  - post-build
  - deploy

include:
  - project: 'lumi-ops/ci-scripts'
    ref: master
    file: 'rules/l2-rules.gitlab-ci.yml'
  - project: 'lumi-ops/ci-scripts'
    ref: master
    file: 'docker/before-script-docker.gitlab-ci.yml'
  - project: 'lumi-ops/ci-scripts'
    ref: master
    file: 'docker/build-docker-image.gitlab-ci.yml'
  - project: 'lumi-ops/ci-scripts'
    ref: master
    file: 'docker/build-docker-image-dotnet.gitlab-ci.yml'
  - project: 'lumi-ops/ci-scripts'
    ref: master
    file: 'docker/post-build-docker-image.gitlab-ci.yml'
  - project: "lumi-ops/ci-scripts"
    ref: master
    file: "docker/deploy-swarm-service.gitlab-ci.yml"
  - .gitlab-ci/rules.gitlab-ci.yml
  - .gitlab-ci/gamelobby/gamelobby.gitlab-ci.yml
  - .gitlab-ci/ow-api/ow-api.gitlab-ci.yml

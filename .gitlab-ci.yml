image: mcr.microsoft.com/dotnet/core/sdk:3.1

stages:
  - deploy

before_script:
  - echo $CURRENT_TAG
  - if echo "$CI_COMMIT_TAG" | grep -q "$CURRENT_TAG";
    then
      echo "Continue deploying";
    elif [ "$CI_COMMIT_BRANCH" == "master" ]; then
      echo "Continue deploying";
    else
      echo "This job has tag is not used for current repository";
      exit 1;
    fi
  - eval $(ssh-agent -s)
  - echo "$SSH_KEY" | ssh-add -
  - mkdir -p ~/.ssh
  - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  - export COMMIT_MESSAGE=$(git log -1 --pretty=%B)
  - git config --global user.email "luminet.minigame.app@gmail.com"
  - git config --global user.name "Luminet"

.base-deploy:
  stage: deploy
  tags:
    - docker
  retry:
    max: 2
    when:
      - runner_system_failure
      - forward_deployment_failure
      - archived_failure

include:
  - .gitlab-ci-ow-api-simulator.yml
  - .gitlab-ci-game-lobby-simulator.yml
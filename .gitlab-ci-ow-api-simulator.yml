variables: 
  OW_API_ROOT_PATH: ./OW.ApiSimulator
  OW_API_BUILD_PATH: ./build/web-api
  OW_API_PROJECT_NAME: OW.ApiSimulator.csproj

.ow-api-push-git-compiled:
  script: 
    - if [ "$CI_ENVIRONMENT_NAME" == "PRO" ]; 
      then
        export GIT_BRANCH=master;
      else
        export GIT_BRANCH=$CI_ENVIRONMENT_NAME;
      fi
    - echo $GIT_BRANCH
    - echo "====== Pushing git compiled ... ======"
    - git clone --branch $GIT_BRANCH $OW_API_GIT_COMPILED_REPO $OW_API_BUILD_PATH
    - mkdir temp
    - mv $OW_API_BUILD_PATH/.git ./temp
    - rm -rfv $OW_API_BUILD_PATH/
    - cp -r ./temp/ $OW_API_BUILD_PATH
    - dotnet publish -c $CI_ENVIRONMENT_NAME -r linux-x64 --self-contained false $OW_API_ROOT_PATH/$OW_API_PROJECT_NAME -o $OW_API_BUILD_PATH
    - cp $OW_API_ROOT_PATH/gitlab-ci-after-script-${CI_ENVIRONMENT_NAME}.sh $OW_API_BUILD_PATH
    - cd $OW_API_BUILD_PATH
    - git add .
    - if [ -z "$(git status --porcelain)" ]; 
      then 
        echo "Nothing change"; 
      else 
       git commit -m "$COMMIT_MESSAGE"; git push -u origin $GIT_BRANCH -f;
       echo "==============Waiting for after script execution==============";
       sleep 60; 
      fi

local_deploy_ow_api_simulator:
  extends: 
    - .base-deploy
    - .ow-api-push-git-compiled
  environment:
    name: LOCAL
  only:
    - /^deploy-local-\d{8}-\d+.*$/
    - /^deploy-local-ow-api-simulator-\d{8}-\d+.*$/
    - /^deploy-ow-api-simulator-\d{8}-\d+.*$/
      
sit_deploy_ow_api_simulator:
  extends: 
    - .base-deploy
    - .ow-api-push-git-compiled
  environment:
    name: SIT
  only:
    - /^deploy-sit-\d{8}-\d+.*$/
    - /^deploy-sit-ow-api-simulator-\d{8}-\d+.*$/
    - /^deploy-ow-api-simulator-\d{8}-\d+.*$/
    

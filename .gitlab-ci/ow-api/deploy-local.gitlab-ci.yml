build_image_ow_api_local:
  extends:
    - .deploy_vars_ow_api
    - .build_image
    - .deploy-ow:local:rules
  environment:
    name: LOCAL

post_build_ow_api_local:
  extends:
    - .deploy_vars_ow_api
    - .post_build
    - .deploy-ow:local:rules
  needs: ['build_image_ow_api_local']
  environment:
    name: LOCAL

deploy_ow_api_local:
  extends:
    - .deploy_vars_ow_api
    - .base_deploy_local
    - .deploy-ow:local:rules
  needs: ['post_build_ow_api_local']
  variables:
    SERVER_IP: $LOCAL_IP
    SERVER_USER: $LOCAL_USER
    SERVER_PORT: $LOCAL_SSH_PORT
    DOCKER_PUBLIC_PORT: 7772
    DOCKER_PRIVATE_PORT: 7772
  environment:
    name: LOCAL

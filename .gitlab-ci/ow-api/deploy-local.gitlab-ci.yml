build_image_ow_api_local:
  extends:
    - .deploy_vars_ow_api
    - .build_image
    - .deploy:local:rules
  environment:
    name: LOCAL

post_build_ow_api_local:
  extends:
    - .deploy_vars_ow_api
    - .post_build
    - .deploy:local:rules
  needs: ['build_image_ow_api_local']
  environment:
    name: LOCAL

deploy_ow_api_local:
  extends:
    - .deploy_vars_ow_api
    - .base_deploy_swarm_service
    - .deploy:local:rules
  needs: ['post_build_ow_api_local']
  variables:
    SERVER_IP: $SC_SWARM_LEADER_LOCAL
    SERVER_USER: $SC_SWARM_LEADER_LOCAL_SSH_USER
    SERVER_PORT: $SC_SWARM_LEADER_LOCAL_SSH_PORT
    SWARM_NODES: $SC_SWARM_CLUSTER_LOCAL
    SWARM_REPLICAS: 1
    NODE_LABEL: L1
    DOCKER_PUBLIC_PORT: 8105
    DOCKER_PRIVATE_PORT: 8105
    DOCKER_NETWORK_NAME: lumi-network
  environment:
    name: LOCAL

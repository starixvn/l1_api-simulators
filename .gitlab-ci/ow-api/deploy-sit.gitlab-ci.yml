build_image_ow_api_sit:
  extends:
    - .deploy_vars_ow_api
    - .build_image
    - .deploy-ow:sit:rules
  environment:
    name: SIT

post_build_ow_api_sit:
  extends:
    - .deploy_vars_ow_api
    - .post_build
    - .deploy-ow:sit:rules
  needs: ['build_image_ow_api_sit']
  environment:
    name: SIT

deploy_ow_api_sit:
  extends:
    - .deploy_vars_ow_api
    - .base_deploy_kbt
    - .deploy-ow:sit:rules
  needs: ['post_build_ow_api_sit']
  variables:
    SERVER_IP: $SIT_IP
    SERVER_USER: $SIT_USER
    SERVER_PORT: $SIT_SSH_PORT
    DOCKER_PUBLIC_PORT: 6601
    DOCKER_PRIVATE_PORT: 6601
  environment:
    name: SIT

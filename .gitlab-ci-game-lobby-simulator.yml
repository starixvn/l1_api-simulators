variables: 
  GAMELOBBY_ROOT_PATH: ./L1.GameLobbySimulator
  GAMELOBBY_COMPILED_PATH: ../game-lobby-simulator

.gamelobby-push-git-compiled:
  script: 
    - if [ "$CI_ENVIRONMENT_NAME" == "PRO" ]; 
      then
        export GIT_BRANCH=master;
      else
        export GIT_BRANCH=$CI_ENVIRONMENT_NAME;
      fi
    - echo $GIT_BRANCH 
    - echo "====== Pushing git compiled ... ======"
    - git clone --branch $GIT_BRANCH $GAMELOBBY_GIT_COMPILED_REPO $GAMELOBBY_COMPILED_PATH
    - mkdir temp
    - mv $GAMELOBBY_COMPILED_PATH/.git ./temp
    - rm -rfv $GAMELOBBY_COMPILED_PATH/
    - cp -r ./temp/ $GAMELOBBY_COMPILED_PATH
    - cp $GAMELOBBY_ROOT_PATH/game-client-config.${CI_ENVIRONMENT_NAME}.json $GAMELOBBY_ROOT_PATH/game-client-config.json
    - cp -R $GAMELOBBY_ROOT_PATH/* $GAMELOBBY_COMPILED_PATH
    - cd $GAMELOBBY_COMPILED_PATH
    - git add .
    - if [ -z "$(git status --porcelain)" ]; 
      then 
        echo "Nothing change"; 
      else 
       git commit -m "$COMMIT_MESSAGE"; git push -u origin $GIT_BRANCH;
       echo "==============Waiting for after script execution==============";
       sleep 60; 
      fi

local_deploy_game_lobby_simulator:
  extends:
    - .base-deploy
    - .gamelobby-push-git-compiled
  environment:
    name: LOCAL
  only:
    - /^l1-deploy-local-\d{8}-\d+.*$/
    - /^l1-deploy-local-game-lobby-simulator-\d{8}-\d+.*$/
    - /^l1-deploy-game-lobby-simulator-\d{8}-\d+.*$/
    
sit_deploy_game_lobby_simulator:
  extends:
    - .base-deploy
    - .gamelobby-push-git-compiled
  environment:
    name: SIT
  only:
    - /^l1-deploy-sit-\d{8}-\d+.*$/
    - /^l1-deploy-sit-game-lobby-simulator-\d{8}-\d+.*$/
    - /^l1-deploy-game-lobby-simulator-\d{8}-\d+.*$/
    
